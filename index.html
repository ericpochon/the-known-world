<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Known World — Eric Pochon</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="carte" aria-label="Carte de The Known World"></div>

  <header class="bandeau">
    <h1>The Known World</h1>
    <a class="insta" href="https://www.instagram.com/eric.pochon/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"/>
      </svg>
      @eric.pochon
    </a>
  </header>

  <aside id="panneau" role="dialog" aria-labelledby="panneau-titre" tabindex="-1" inert>
    <div class="entete">
      <span class="poignee" aria-hidden="true"></span>
      <h2 id="panneau-titre"></h2>
      <button class="fermer" type="button" aria-label="Fermer">&times;</button>
    </div>
    <div class="galerie">
      <p class="vide" hidden>Pas encore d'image</p>
      <img id="galerie-image" alt="">
      <button class="agrandir" type="button" aria-label="Agrandir l'image">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>
      </button>
      <button class="nav prec" type="button" aria-label="Image précédente">&lsaquo;</button>
      <button class="nav suiv" type="button" aria-label="Image suivante">&rsaquo;</button>
    </div>
    <div class="infos">
      <p class="compteur"></p>
      <p class="legende"></p>
      <p class="texte"></p>
    </div>
  </aside>

  <div id="visionneuse" role="dialog" aria-label="Image agrandie" hidden>
    <div id="visionneuse-carte"></div>
    <button class="v-fermer" type="button" aria-label="Fermer l'image">&times;</button>
    <button class="nav prec" type="button" aria-label="Image précédente">&lsaquo;</button>
    <button class="nav suiv" type="button" aria-label="Image suivante">&rsaquo;</button>
    <p class="v-compteur"></p>
  </div>

  <div id="coords" hidden>Cliquez deux coins opposés d’un cartouche</div>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="lieux.js"></script>
  <script src="app.js"></script>
</body>
</html>
